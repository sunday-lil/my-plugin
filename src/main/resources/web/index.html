<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EssentialsX-Clone 配置面板</title>
    <style>
        :root {
            --bg: #0f1720;
            --panel: #17212b;
            --panel-2: #1e2b38;
            --text: #dbe7f3;
            --muted: #8fa6bb;
            --accent: #35c98f;
            --danger: #ff6b6b;
            --border: #2b3a4a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .container { max-width: 1080px; margin: 0 auto; padding: 24px 18px 60px; }
        h1 { font-size: 24px; margin: 0 0 4px; }
        .subtitle { color: var(--muted); margin-bottom: 18px; }
        .toolbar {
            position: sticky; top: 0; z-index: 5;
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            padding: 12px 0; margin-bottom: 16px;
            background: linear-gradient(var(--bg) 80%, transparent);
        }
        button {
            border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
            padding: 8px 14px; border-radius: 6px; cursor: pointer;
        }
        button:hover { border-color: var(--accent); }
        button.primary { background: var(--accent); border-color: var(--accent); color: #062016; font-weight: 600; }
        button.danger { border-color: var(--danger); color: var(--danger); }
        input[type=text], input[type=number], input[type=password], textarea, select {
            width: 100%; padding: 8px 10px; border-radius: 6px;
            border: 1px solid var(--border); background: #0c141c; color: var(--text);
            font: inherit;
        }
        textarea { min-height: 92px; resize: vertical; font-family: Consolas, monospace; }
        .section {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px 18px; margin-bottom: 14px;
        }
        .section h2 { font-size: 16px; margin: 0 0 12px; color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 18px; }
        .field label { display: block; margin-bottom: 4px; color: var(--muted); }
        .field .hint { color: #6f879c; font-size: 12px; margin-top: 3px; }
        .field.bool { display: flex; align-items: center; gap: 8px; }
        .field.bool label { margin: 0; color: var(--text); }
        .field.bool input { width: auto; }
        #status {
            display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 6px;
            border: 1px solid var(--border);
        }
        #status.ok { display: block; border-color: var(--accent); color: var(--accent); }
        #status.err { display: block; border-color: var(--danger); color: var(--danger); }
        #raw {
            display: none; white-space: pre-wrap; background: #0c141c;
            border: 1px solid var(--border); border-radius: 8px; padding: 14px;
            max-height: 420px; overflow: auto; font-family: Consolas, monospace;
        }
        .token-row { display: flex; gap: 8px; align-items: center; margin-left: auto; }
        .token-row input { width: 220px; }
    </style>
</head>
<body>
<div class="container">
    <h1>EssentialsX-Clone 配置面板</h1>
    <div class="subtitle">支持 K10 数字孪生、环境数据、数字城市、经济、传送、聊天与 Web 设置。修改后点击“保存到服务器”即可热重载（Web 端口需重启）。</div>

    <div id="status"></div>

    <div class="toolbar">
        <button class="primary" onclick="saveConfig()">保存到服务器</button>
        <button onclick="loadConfig()">从服务器重新加载</button>
        <button onclick="downloadConfig()">下载 config.yml</button>
        <button onclick="toggleRaw()">查看原始配置</button>
        <div class="token-row">
            <label for="api-token-access" style="color:var(--muted)">API Token</label>
            <input type="password" id="api-token-access" placeholder="未设置可留空" onchange="saveToken()">
        </div>
    </div>

    <div id="form"></div>
    <pre id="raw"></pre>
</div>

<script>
const SCHEMA = [
    {
        title: "K10 数字孪生",
        fields: [
            { path: "k10.enabled", label: "启用 K10 系统", type: "bool" },
            { path: "k10.host", label: "K10 IP 地址", type: "text" },
            { path: "k10.port", label: "K10 HTTP 端口", type: "number" },
            { path: "k10.connection-timeout", label: "连接超时（毫秒）", type: "number" },
            { path: "k10.read-timeout", label: "读取超时（毫秒）", type: "number", hint: "K10 刷屏较慢时建议 8000" },
            { path: "k10.max-retries", label: "最大重试次数", type: "number" },
            { path: "k10.player-events-enabled", label: "推送玩家加入/退出/死亡", type: "bool" },
            { path: "k10.chat-events-enabled", label: "推送聊天消息", type: "bool" },
            { path: "k10.debug-mode", label: "K10 详细日志", type: "bool" }
        ]
    },
    {
        title: "环境数据",
        fields: [
            { path: "environment.enabled", label: "启用环境数据", type: "bool" },
            { path: "environment.scan-radius", label: "扫描半径（格）", type: "number" },
            { path: "environment.height-range", label: "高度范围（格）", type: "number" },
            { path: "environment.report-interval", label: "聚合报告周期（ticks）", type: "number", hint: "1200 ticks = 60 秒，下限 200" },
            { path: "environment.max-players-in-report", label: "单条报告最多玩家数", type: "number", hint: "与 K10 固件上限 20 对齐" },
            { path: "environment.response-timeout", label: "响应超时（毫秒）", type: "number" },
            { path: "environment.max-retries", label: "最大重试次数", type: "number" },
            { path: "environment.debug-mode", label: "环境详细日志", type: "bool" }
        ]
    },
    {
        title: "数字城市",
        fields: [
            { path: "digital-city.enabled", label: "启用数字城市", type: "bool" },
            { path: "digital-city.city-name", label: "城市名称", type: "text" },
            { path: "digital-city.dashboard-interval", label: "仪表盘周期（ticks）", type: "number" },
            { path: "digital-city.statistics-interval", label: "详细统计周期（ticks）", type: "number" },
            { path: "digital-city.debug-mode", label: "城市详细日志", type: "bool" },
            { path: "digital-city.welcome-message-enabled", label: "加入时推送欢迎事件", type: "bool" },
            { path: "digital-city.block-tracking-enabled", label: "统计方块操作", type: "bool" },
            { path: "digital-city.chat-tracking-enabled", label: "统计聊天", type: "bool" },
            { path: "digital-city.redstone-tracking-enabled", label: "统计红石活动", type: "bool" },
            { path: "digital-city.redstone-surge-threshold", label: "红石激增阈值（次/周期）", type: "number" },
            { path: "digital-city.households.enabled", label: "启用住户扫描", type: "bool" },
            { path: "digital-city.households.scan-interval", label: "住户扫描周期（ticks）", type: "number" },
            { path: "digital-city.households.scan-radius", label: "住户扫描半径（格）", type: "number" },
            { path: "digital-city.households.door-bed-radius", label: "床与门判定距离（格）", type: "number" }
        ]
    },
    {
        title: "经济与银行",
        fields: [
            { path: "economy.enabled", label: "启用经济系统", type: "bool" },
            { path: "economy.starting-balance", label: "玩家初始资金", type: "number" },
            { path: "bank.initial-balance", label: "银行开户初始余额", type: "number" },
            { path: "bank.min-deposit", label: "最低存款", type: "number" },
            { path: "bank.max-deposit", label: "最高存款", type: "number" },
            { path: "bank.transfer-fee", label: "银行转账手续费", type: "number" }
        ]
    },
    {
        title: "家园、传送点与传送",
        fields: [
            { path: "homes.enabled", label: "启用家园系统", type: "bool" },
            { path: "homes.max-homes", label: "默认家园上限", type: "number" },
            { path: "homes.max-homes-with-permission", label: "权限家园上限", type: "number" },
            { path: "warps.enabled", label: "启用传送点系统", type: "bool" },
            { path: "warps.max-warps", label: "传送点数量上限", type: "number" },
            { path: "teleport.enabled", label: "启用传送系统", type: "bool" },
            { path: "teleport.request-timeout", label: "请求超时（秒）", type: "number" },
            { path: "teleport.cooldown", label: "传送冷却（秒）", type: "number" },
            { path: "teleport.safety-check", label: "传送安全检查", type: "bool" }
        ]
    },
    {
        title: "玩家命令开关",
        fields: [
            { path: "player-commands.fly-enabled", label: "启用 /efly", type: "bool" },
            { path: "player-commands.god-enabled", label: "启用 /egod", type: "bool" },
            { path: "player-commands.heal-enabled", label: "启用 /eheal", type: "bool" },
            { path: "player-commands.feed-enabled", label: "启用 /efeed", type: "bool" },
            { path: "player-commands.gamemode-enabled", label: "启用 /egm", type: "bool" }
        ]
    },
    {
        title: "聊天与提示",
        fields: [
            { path: "chat.prefix", label: "聊天前缀", type: "text" },
            { path: "chat.color-enabled", label: "启用颜色代码", type: "bool" },
            { path: "chat.format-enabled", label: "启用自定义聊天格式", type: "bool" },
            { path: "chat.format", label: "聊天格式", type: "text", hint: "支持 %prefix% %player% %message% %level% 等" },
            { path: "chat.actionbar-enabled", label: "聊天动作栏提示", type: "bool" },
            { path: "chat.hints.enabled", label: "启用聊天提示", type: "bool" },
            { path: "chat.hints.emoji-conversion", label: "启发表情转换", type: "bool" },
            { path: "chat.hints.command-suggestions", label: "启用命令建议", type: "bool" },
            { path: "chat.hints.reply-suggestions", label: "启用回复建议", type: "bool" },
            { path: "chat.hints.stats-enabled", label: "启用聊天统计", type: "bool" }
        ]
    },
    {
        title: "公告与加入消息",
        fields: [
            { path: "announcements.interval", label: "公告轮播间隔（秒）", type: "number" },
            { path: "announcements.random-order", label: "随机顺序", type: "bool" },
            { path: "announcements.bossbar.enabled", label: "启用 BossBar 公告", type: "bool" },
            { path: "announcements.bossbar.color", label: "BossBar 颜色", type: "text" },
            { path: "announcements.bossbar.style", label: "BossBar 样式", type: "text" },
            { path: "announcements.messages", label: "聊天公告（每行一条）", type: "list" },
            { path: "join-message.enabled", label: "启用加入消息", type: "bool" },
            { path: "join-message.server-name", label: "服务器名称", type: "text" },
            { path: "join-message.prefix", label: "消息前缀", type: "text" },
            { path: "join-message.send-help-guide-on-join", label: "进服发送功能指南", type: "bool" },
            { path: "join-message.title.text", label: "欢迎主标题", type: "text" },
            { path: "join-message.title.subtitle", label: "欢迎副标题", type: "text" },
            { path: "join-message.action-bar.text", label: "动作栏欢迎文字", type: "text" }
        ]
    },
    {
        title: "Web、玩法与调试",
        fields: [
            { path: "web-server.port", label: "Web 端口（重启生效）", type: "number" },
            { path: "web.allowed-ips", label: "API IP 白名单（每行一条）", type: "list" },
            { path: "web.api-token", label: "API Token", type: "text", hint: "留空表示仅用 IP 白名单" },
            { path: "gameplay.auto-pickup.enabled", label: "方块破坏自动拾取", type: "bool" },
            { path: "update-check.enabled", label: "启用 GitHub 更新检查", type: "bool" },
            { path: "debug-info.default-ping", label: "默认 Ping 值", type: "number" }
        ]
    }
];

let config = {};

function getToken() {
    return localStorage.getItem("dsh-config-token") || "";
}

function saveToken() {
    localStorage.setItem("dsh-config-token", document.getElementById("api-token-access").value);
}

function withToken(url) {
    const token = getToken();
    if (!token) return url;
    return url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
}

function showStatus(message, ok) {
    const el = document.getElementById("status");
    el.textContent = message;
    el.className = ok ? "ok" : "err";
    clearTimeout(showStatus.timer);
    showStatus.timer = setTimeout(() => { el.className = ""; el.style.display = "none"; }, 5000);
}

function unflatten(flat) {
    const result = {};
    for (const [key, value] of Object.entries(flat)) {
        setPath(result, key, value);
    }
    return result;
}

function setPath(obj, path, value) {
    const parts = path.split(".");
    let current = obj;
    for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (typeof current[part] !== "object" || current[part] === null) {
            current[part] = {};
        }
        current = current[part];
    }
    current[parts[parts.length - 1]] = value;
}

function getPath(obj, path, fallback) {
    const parts = path.split(".");
    let current = obj;
    for (const part of parts) {
        if (current === undefined || current === null) return fallback;
        current = current[part];
    }
    return current === undefined || current === null ? fallback : current;
}

function render() {
    const form = document.getElementById("form");
    form.innerHTML = "";

    for (const section of SCHEMA) {
        const box = document.createElement("div");
        box.className = "section";
        const title = document.createElement("h2");
        title.textContent = section.title;
        box.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "grid";

        for (const field of section.fields) {
            const wrapper = document.createElement("div");
            wrapper.className = field.type === "bool" ? "field bool" : "field";

            const id = "f_" + field.path.replace(/[^a-zA-Z0-9]/g, "_");
            let input;
            const value = getPath(config, field.path, field.type === "bool" ? true : "");

            if (field.type === "bool") {
                input = document.createElement("input");
                input.type = "checkbox";
                input.checked = value === true || value === "true";
            } else if (field.type === "number") {
                input = document.createElement("input");
                input.type = "number";
                input.step = "any";
                input.value = value;
            } else if (field.type === "list" || field.type === "json") {
                input = document.createElement("textarea");
                input.value = Array.isArray(value)
                    ? (field.type === "json" ? JSON.stringify(value, null, 2) : value.join("\n"))
                    : (value || "");
            } else {
                input = document.createElement("input");
                input.type = "text";
                input.value = value;
            }
            input.id = id;
            input.dataset.path = field.path;
            input.dataset.type = field.type;

            if (field.type === "bool") {
                wrapper.appendChild(input);
                const boolLabel = document.createElement("label");
                boolLabel.htmlFor = id;
                boolLabel.textContent = field.label;
                wrapper.appendChild(boolLabel);
            } else {
                const label = document.createElement("label");
                label.htmlFor = id;
                label.textContent = field.label;
                wrapper.appendChild(label);
                wrapper.appendChild(input);
            }
            if (field.hint) {
                const hint = document.createElement("div");
                hint.className = "hint";
                hint.textContent = field.hint;
                wrapper.appendChild(hint);
            }
            grid.appendChild(wrapper);
        }

        box.appendChild(grid);
        form.appendChild(box);
    }
}

function collect() {
    const result = {};
    for (const section of SCHEMA) {
        for (const field of section.fields) {
            const input = document.getElementById("f_" + field.path.replace(/[^a-zA-Z0-9]/g, "_"));
            if (!input) continue;

            let value;
            if (field.type === "bool") {
                value = input.checked;
            } else if (field.type === "number") {
                if (input.value === "") continue;
                value = Number(input.value);
                if (!Number.isFinite(value)) {
                    throw new Error(field.label + " 不是有效数字");
                }
            } else if (field.type === "list") {
                value = input.value.split("\n").map(s => s.trim()).filter(s => s.length > 0);
            } else if (field.type === "json") {
                try {
                    value = JSON.parse(input.value);
                } catch (e) {
                    throw new Error(field.label + " JSON 格式错误: " + e.message);
                }
            } else {
                value = input.value;
            }
            setPath(result, field.path, value);
        }
    }
    return result;
}

async function loadConfig() {
    try {
        const response = await fetch(withToken("/api/config"), { headers: { "Accept": "application/json" } });
        if (!response.ok) {
            throw new Error("HTTP " + response.status + "（如已设置 API Token，请先在右上角填写）");
        }
        const flat = await response.json();
        config = unflatten(flat);
        document.getElementById("api-token-access").value = getToken();
        render();
        document.getElementById("raw").textContent = JSON.stringify(flat, null, 2);
        showStatus("配置已从服务器加载", true);
    } catch (e) {
        showStatus("加载失败: " + e.message, false);
    }
}

async function saveConfig() {
    try {
        const payload = collect();
        const response = await fetch(withToken("/api/config"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const text = await response.text();
        if (!response.ok) {
            throw new Error("HTTP " + response.status + " " + text);
        }
        const token = getPath(payload, "web.api-token", "");
        if (token) {
            localStorage.setItem("dsh-config-token", token);
        }
        showStatus("配置已保存并触发热重载（Web 端口需重启）", true);
        await loadConfig();
    } catch (e) {
        showStatus("保存失败: " + e.message, false);
    }
}

function toggleRaw() {
    const raw = document.getElementById("raw");
    raw.style.display = raw.style.display === "block" ? "none" : "block";
}

function toYaml(obj, indent) {
    indent = indent || "";
    let out = "";
    for (const [key, value] of Object.entries(obj)) {
        if (value !== null && typeof value === "object") {
            if (Array.isArray(value)) {
                out += indent + key + ":\n";
                for (const item of value) {
                    if (item !== null && typeof item === "object") {
                        out += indent + "  - " + JSON.stringify(item) + "\n";
                    } else {
                        out += indent + "  - " + String(item) + "\n";
                    }
                }
            } else {
                out += indent + key + ":\n" + toYaml(value, indent + "  ");
            }
        } else {
            out += indent + key + ": " + String(value) + "\n";
        }
    }
    return out;
}

function downloadConfig() {
    try {
        const data = collect();
        const blob = new Blob([toYaml(data)], { type: "text/yaml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "config.yml";
        a.click();
        URL.revokeObjectURL(url);
    } catch (e) {
        showStatus("下载失败: " + e.message, false);
    }
}

window.addEventListener("load", loadConfig);
</script>
</body>
</html>
