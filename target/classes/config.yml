# EssentialsX-Clone 配置文件
# 服务器核心功能配置

# 行空板K10数字孪生系统设置
k10:
  # 是否启用K10数字孪生系统
  enabled: true
  # K10设备IP地址
  host: "192.168.1.235"
  # K10设备端口号（HTTP服务端口）
  port: 80
  # 连接超时时间（毫秒）
  connection-timeout: 3000
  # 连接失败最大重试次数
  max-retries: 3
  # 是否启用玩家事件监听
  player-events-enabled: true
  # 是否启用聊天事件监听
  chat-events-enabled: true

# 环境数据系统设置
environment:
  # 是否启用环境数据系统
  enabled: true
  # 扫描半径（格）
  scan-radius: 10
  # 高度范围（格）
  height-range: 5
  # 基础计算间隔（ticks，1秒=20ticks）
  base-interval: 100
  # 最小计算间隔（ticks）
  min-interval: 50
  # 最大计算间隔（ticks）
  max-interval: 500
  # 响应超时时间（毫秒）
  response-timeout: 5000
  # 最大重试次数
  max-retries: 3
  # 是否启用调试模式
  debug-mode: false

# 经济系统设置
economy:
  # 是否启用经济系统
  enabled: true
  # 玩家初始资金
  starting-balance: 100.0
  # 货币单位符号
  currency-symbol: "$"
  # 小数位数
  decimal-places: 2

# 家园系统设置
homes:
  # 是否启用家园系统
  enabled: true
  # 普通玩家默认家园数量上限
  max-homes: 5
  # 拥有特定权限的玩家家园数量上限
  max-homes-with-permission: 10
  # 家园传送冷却时间（秒）
  teleport-cooldown: 5

# 传送点系统设置
warps:
  # 是否启用传送点系统
  enabled: true
  # 传送点数量限制（对拥有特定权限的玩家）
  max-warps: 5

# 传送系统设置
teleport:
  # 是否启用传送系统
  enabled: true
  # 传送请求超时时间（秒）
  request-timeout: 60
  # 传送冷却时间（秒）
  cooldown: 5
  # 传送安全检查（防止传送到危险位置）
  safety-check: true

# 玩家命令设置
player-commands:
  # 是否启用飞行命令 (/efly)
  fly-enabled: true
  # 是否启用上帝模式命令 (/egod)
  god-enabled: true
  # 是否启用治疗命令 (/eheal)
  heal-enabled: true
  # 是否启用喂食命令 (/efeed)
  feed-enabled: true
  # 是否启用游戏模式命令 (/egm)
  gamemode-enabled: true

# 聊天与消息设置
chat:
  # 消息通用前缀
  prefix: "&6[EssentialsX]&r "
  # 是否启用彩色消息
  color-enabled: true
  # 是否启用聊天格式化功能
  format-enabled: true
  # 是否启用聊天动作栏提示
  actionbar-enabled: true
  # 聊天格式模板（支持丰富的占位符）
  # 可用占位符：%prefix%, %player%, %displayname%, %message%, %time%, %world%, %level%, %level_color%, %player_prefix%, %player_suffix%, %online%, %max_players%, %ping%, %gamemode%
  format: "&8[&e%time%&8] %player_prefix%%level_color%[Lv.%level%]&r %player%%player_suffix%&7: &r%message%"
  
  # 高级聊天格式选项
  advanced-formats:
    # 管理员聊天格式
    admin: "&8[&c管理&8] &4%player% &7: &f%message%"
    # VIP玩家聊天格式
    vip: "&8[&dVIP&8] &d%player% &7: &f%message%"
    # 普通玩家聊天格式
    default: "&8[&a玩家&8] &7%player% &7: &f%message%"
    # 新玩家聊天格式（等级低于10）
    newbie: "&8[&b新手&8] &b%player% &7: &f%message%"
  
  # 聊天提示功能设置
  hints:
    # 是否启用聊天提示功能
    hints-enabled: true
    # 是否启用表情符号自动转换
    emoji-conversion: true
    # 是否启用命令建议提示
    command-suggestions: true
    # 是否启用智能回复提示
    reply-suggestions: true
    # 是否启用聊天统计功能
    stats-enabled: true
    
    # 表情符号映射表（可以自定义添加）
    custom-emojis:
      ":smile:": "😊"
      ":laugh:": "😂"
      ":cool:": "😎"
      ":wink:": "😉"
      ":heart:": "❤️"
      ":star:": "⭐"
      ":fire:": "🔥"
      ":thumbsup:": "👍"
      ":rocket:": "🚀"

# 登录/退出消息系统 (JoinMessage Plus)
join-message:
  # 服务器名称（用于变量替换）
  server-name: "geek服务器"
  # 是否启用登录消息系统
  enabled: true
  
  # 是否在玩家加入时自动发送功能使用指南
  send-help-guide-on-join: true
  
  # 大屏幕标题设置
  title:
    # 是否启用标题显示
    enabled: true
    # 主标题文字
    text: "&6&l欢迎回来!"
    # 副标题文字
    subtitle: "&e%player% &7- 享受游戏时光!"
    # 淡入时间（tick，每tick=0.05秒）
    fade-in: 10
    # 停留时间（tick）
    stay: 40
    # 淡出时间（tick）
    fade-out: 10
  
  # 动作栏设置
  action-bar:
    # 是否启用动作栏
    enabled: true
    # 动作栏文字
    text: "&a欢迎 &e%player% &a加入! &7在线玩家: &6%online% &7/ &6%max_players%"
    # 显示时长（秒）
    duration: 5
  
  # 聊天框消息设置
  chat-message:
    # 是否启用聊天框欢迎消息
    enabled: true
    # 随机欢迎消息列表
    messages:
      - "&a🎉 热烈欢迎 &e%player% &a加入服务器! &7当前在线: &6%online% &7/ &6%max_players% &7玩家"
      - "&a🌟 新冒险家 &e%player% &a加入了我们的世界! &7服务器时间: &6%time%"
      - "&a🚀 欢迎 &e%player% &a来到 &6%server_name%&a! &7祝您游戏愉快!"
      - "&a💫 玩家 &e%player% &a刚刚上线! &7世界: &6%world% &7| 坐标: &6%x%,%y%,%z%"
      - "&a🎯 &e%player% &a加入了游戏! &7今日第 &6%join_count% &7位玩家"
      - "&a🏆 欢迎 &e%player% &a! &7服务器已运行: &6%uptime% &7小时"
      - "&a🎮 &e%player% &a进入了游戏! &7当前世界时间: &6%world_time%"
      - "&a✨ 热烈欢迎 &e%player% &a! &7您的UUID: &6%uuid_short%"
      - "&a🎊 &e%player% &a加入了服务器! &7游戏模式: &6%gamemode%"
      - "&a🎪 欢迎 &e%player% &a! &7您的Ping: &6%ping%ms"
  
  # 退出消息设置
  quit-message:
    # 是否启用退出消息
    enabled: true
    # 随机退出消息列表
    messages:
      - "&c😢 玩家 &e%player% &c离开了服务器... &7期待再次相遇!"
      - "&c👋 &e%player% &c已下线，当前在线: &6%online% &c/ &6%max_players% &7玩家"
      - "&c💨 &e%player% &c退出了游戏，服务器时间: &6%time%"
      - "&c🚪 &e%player% &c离开了 &6%server_name%&c! &7感谢您的参与!"
      - "&c🌙 &e%player% &c下线了，世界: &6%world% &7| 坐标: &6%x%,%y%,%z%"
      - "&c📉 &e%player% &c离开了游戏，今日累计在线玩家: &6%total_players_today%"
      - "&c⏰ &e%player% &c已退出，服务器已运行: &6%uptime% &c小时"
      - "&c🎭 &e%player% &c离开了服务器，游戏模式: &6%gamemode%"
      - "&c📱 &e%player% &c下线了，Ping: &6%ping%ms"
  
  # 烟花特效设置
  fireworks:
    # 是否启用烟花特效（仅对新玩家）
    enabled: true
    # 烟花数量
    amount: 3
    # 烟花颜色偏好（可选值：RED, GREEN, BLUE, PURPLE, ORANGE, YELLOW, WHITE等）
    preferred-colors: ["RED", "GREEN", "BLUE", "PURPLE", "ORANGE"]

# 脏话过滤系统设置
profanity-filter:
  # 是否启用脏话过滤系统
  enabled: true
  # 违规踢出阈值（违规次数达到此数值后踢出玩家）
  violation-threshold: 3
  # 警告消息内容
  warning-message: "&c[系统警告] 检测到不当言论，请注意文明用语！"
  # 踢出消息内容
  kick-message: "&c由于多次发送不当言论，您已被踢出服务器！请注意网络礼仪！"
  # 脏话词库（支持中文和英文）
  profanity-list:
    # 中文脏话词汇
    chinese:
      - "草"
      - "操"
      - "妈"
      - "逼"
      - "滚"
      - "滚蛋"
      - "去死"
      - "sb"
      - "傻逼"
      - "废物"
      - "混蛋"
      - "笨蛋"
    # 英文脏话词汇
    english:
      - "fuck"
      - "shit"
      - "damn"
      - "bitch"
      - "asshole"
      - "stupid"
      - "idiot"
      - "bastard"
      - "dumb"

# 特殊物品系统设置
special-items:
  # 火焰刀设置
  flame-blade:
    # 是否启用火焰刀功能
    enabled: true
    # 物品显示名称
    display-name: "&c&l火焰刀"
    # 攻击时生成岩浆的持续时间（秒）
    magma-duration: 3
    # 额外基础伤害
    extra-damage: 100

# 公告系统设置 (ChatAnnouncements)
announcements:
  # 是否启用公告系统
  enabled: true
  # 公告消息列表
  messages:
    - "&6[公告] &e欢迎访问我们的服务器！"
    - "&a服务器状态良好，尽情享受游戏！"
    - "&b记得访问我们的网站：&nhttps://zmx.ljcode.cn"
    - "&d每周活动正在进行中，进入网站zmx.ljcode.cn参与赢取奖励！"
  
  # 动作栏公告消息列表
  actionbar-messages:
    - "&6当前在线玩家: &e%server_online% &6/&e %server_max_players%"
    - "&a服务器运行稳定！"
  
  # 标题公告消息列表
  title-messages:
    - ["&6&l每日提示", "&e记得备份你的建筑哦！"]
    - ["&d&l服务器活动", "&zmx.ljcode.cn参与活动！"]
  
  # BossBar公告消息列表
  bossbar:
    # 是否启用BossBar功能
    enabled: true
    messages:
      - "&6&l服务器公告 - 欢迎所有玩家！"
      - "&c&l重要通知：请遵守服务器规则"
      - "&a&l每日签到可获得丰厚奖励！"
  
  # 消息轮播设置
  random-order: true
  # 消息轮播间隔（秒）
  interval: 60

# 权限设置
permissions:
  # 默认权限组标识
  default-group: "default"
  # 管理员权限组标识
  admin-group: "admin"

# 系统设置
system:
  # 是否启用调试模式
  debug-mode: false
  # 数据自动保存间隔（分钟）
  auto-save-interval: 30

# 聊天格式化设置
chat-format:
  # 玩家等级颜色阈值
  level-colors:
    gold-threshold: 80    # 金色等级阈值
    red-threshold: 60     # 红色等级阈值
    blue-threshold: 40    # 蓝色等级阈值
    green-threshold: 20   # 绿色等级阈值
    default-color: "&7"   # 默认颜色
  
  # 玩家前缀设置
  prefixes:
    admin: "&4[管理员]&r "
    moderator: "&2[管理]&r "
    vip: "&d[VIP]&r "
    veteran: "&6[资深]&r "
    active: "&e[活跃]&r "
    default: "&7[玩家]&r "
    
    # 前缀等级阈值
    veteran-level: 50
    active-level: 20
  
  # 玩家后缀设置（基于延迟）
  suffixes:
    low-ping: " &a⚡"
    medium-ping: " &e📶"
    high-ping: " &c📡"
    
    # 延迟阈值（毫秒）
    low-ping-threshold: 50
    medium-ping-threshold: 150
  
  # 动作栏通知设置
  actionbar-notification:
    # 消息截断长度
    message-truncate-length: 20
    # 标题显示时间（tick）
    title-fade-in: 0
    title-stay: 40
    title-fade-out: 10

# 聊天提示设置
chat-hints:
  # 聊天历史设置
  chat-history:
    # 保留最近消息数量
    max-history-size: 50
    # 最近消息显示数量
    recent-messages-display: 5
    # 统计显示间隔（每多少条消息显示一次统计）
    stats-interval: 10
  
  # 活跃度等级设置
  activity-levels:
    very-active: 100
    active: 50
    normal: 20
    
    # 活跃度标签
    very-active-label: "🔥 非常活跃"
    active-label: "🌟 活跃"
    normal-label: "💫 一般"
    default-label: "🌱 新手"

# 玩家加入消息设置
join-message:
  title:
    # 标题显示时间（tick）
    fade-in: 10
    stay: 40
    fade-out: 0

# Web服务器设置
web-server:
  # Web服务器端口
  port: 8080

# 调试信息设置
debug-info:
  # 默认Ping值（当无法获取时）
  default-ping: 100
  # 时间分段定义（用于时间显示）
  time-segments:
    dawn: [0, 1000]
    morning: [1000, 6000]
    noon: [6000, 12000]
    afternoon: [12000, 18000]
    night: [18000, 23000]
    late-night: [23000, 24000]
    
    # 时间标签
    dawn-label: "黎明"
    morning-label: "上午"
    noon-label: "中午"
    afternoon-label: "下午"
    night-label: "夜晚"
    late-night-label: "深夜"